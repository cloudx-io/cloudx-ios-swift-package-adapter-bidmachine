name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Validate manifest
        run: swift package dump-package
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build and test iOS consumers
        run: |
          destination=$(xcrun simctl list devices available --json | \
            jq -r '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) | .value[] | select(.isAvailable)][0].udid // empty')
          if [[ -n "$destination" ]]; then
            xcodebuild test \
              -scheme CloudXBidMachineAdapter \
              -destination "id=$destination" \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild build-for-testing \
              -scheme CloudXBidMachineAdapter \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          fi
      - name: Verify artifact checksum
        run: |
          curl --fail --location --output /tmp/CloudXBidMachineAdapter.xcframework.zip \
            https://github.com/cloudx-io/cloudx-ios-swift-package-adapter-bidmachine/releases/download/binary/3080200.0.0/CloudXBidMachineAdapter.xcframework.zip
          test "$(swift package compute-checksum /tmp/CloudXBidMachineAdapter.xcframework.zip)" = \
            "484d97c96b1a307fd119d3e0177fffad3a86762c4bbc8410ce5c07ee19153525"
